name: Bug report
description: "Reproduce a problem with decision-time features, mature outcomes and replayable review evidence."
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or appropriately licensed public inputs. Do not attach private records or credentials.
        Suspected vulnerabilities: follow [SECURITY.md](https://github.com/dev-belly/CreditVintage/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version or full commit
      description: Include the installed package version and source revision when known.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or API call
      description: Include the working directory assumptions and exact options.
      render: shell
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproducible input and steps
      description: "A minimal synthetic applications/features/performance CSV set, or the exact bundled public-data command; no borrower records."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
      description: "Identify the command family (evaluation, monitoring, feature quality, review or lineage), cutoff, outcome horizon and artifact version. For lineage, include the PITBridge revision."
    validations:
      required: true
