name: Publish research reports

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "scripts/build_public_site.py"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "src/**"
      - "docs/**"
      - "scripts/build_public_site.py"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: dev-belly/PITBridge
          ref: 2f2438aa9b62502c7b1c9773b572d09f6b04f9ea
          path: .pitbridge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" -e .pitbridge
      - name: Check publishing code
        run: |
          ruff check scripts/build_public_site.py
          ruff format --check scripts/build_public_site.py
          mypy scripts/build_public_site.py
      - name: Build and verify public evidence
        run: python scripts/build_public_site.py
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
