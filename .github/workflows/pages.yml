name: Publish research reports

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "examples/german_credit.*"
      - "scripts/build_public_site.py"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "src/**"
      - "docs/**"
      - "examples/german_credit.*"
      - "scripts/build_public_site.py"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: dev-belly/PITBridge
          ref: ed19dc698534f45a2b646fb4976ff6b01966b0cc
          path: .pitbridge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" -e .pitbridge
      - name: Check publishing code
        run: |
          ruff check scripts/build_public_site.py
          ruff format --check scripts/build_public_site.py
          mypy scripts/build_public_site.py
      - name: Build and verify public evidence
        run: |
          python examples/german_credit.py --verify docs/public-credit-comparison
          python scripts/build_public_site.py
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Capture feature-monitor desktop and mobile layouts
        shell: bash
        run: |
          mkdir -p layout-preview
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,1600 --screenshot="$PWD/layout-preview/desktop.png" "file://$PWD/_site/feature-monitor/index.html"
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,2400 --screenshot="$PWD/layout-preview/mobile.png" "file://$PWD/_site/feature-monitor/index.html"
      - name: Retain feature-monitor layout previews
        uses: actions/upload-artifact@v4
        with:
          name: feature-monitor-layouts
          path: layout-preview/*.png
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
