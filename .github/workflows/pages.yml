name: Publish research reports

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/**"
      - "examples/german_credit.*"
      - "scripts/build_public_site.py"
      - "scripts/capture_sba_layouts.py"
      - "scripts/build_credit_brief.py"
      - "scripts/templates/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "src/**"
      - "docs/**"
      - "examples/german_credit.*"
      - "scripts/build_public_site.py"
      - "scripts/capture_sba_layouts.py"
      - "scripts/build_credit_brief.py"
      - "scripts/templates/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dev-belly/PITBridge
          ref: 219e58a7c2acc4a3fcd4f7ffdb68ba8eef0564f0
          path: .pitbridge
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" -e .pitbridge
      - run: python -m pip install playwright==1.64.1
      - name: Install Chinese glyphs for readable browser previews
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          fc-match ':lang=zh-cn'
      - name: Check publishing code
        run: |
          ruff check scripts/build_public_site.py scripts/build_credit_brief.py scripts/capture_sba_layouts.py
          ruff format --check scripts/build_public_site.py scripts/build_credit_brief.py scripts/capture_sba_layouts.py
          mypy scripts/build_public_site.py scripts/build_credit_brief.py
      - name: Build and verify public evidence
        run: |
          python examples/german_credit.py --verify docs/public-credit-comparison
          python scripts/build_public_site.py
      - name: Upload verified site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - name: Capture feature-monitor desktop and mobile layouts
        shell: bash
        run: |
          mkdir -p layout-preview
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,1600 --screenshot="$PWD/layout-preview/desktop.png" "file://$PWD/_site/feature-monitor/index.html"
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,2400 --screenshot="$PWD/layout-preview/mobile.png" "file://$PWD/_site/feature-monitor/index.html"
      - name: Retain feature-monitor layout previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: feature-monitor-layouts
          path: layout-preview/*.png
          if-no-files-found: error
      - name: Capture feature-quality layouts
        shell: bash
        run: |
          mkdir -p quality-layout
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,2600 --screenshot="$PWD/quality-layout/desktop.png" "file://$PWD/_site/feature-quality/index.html"
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,3800 --screenshot="$PWD/quality-layout/mobile.png" "file://$PWD/_site/feature-quality/index.html"
      - name: Retain feature-quality previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: feature-quality-layouts
          path: quality-layout/*.png
          if-no-files-found: error
      - name: Capture coverage-policy layouts
        shell: bash
        run: |
          mkdir -p policy-layout
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,1900 --screenshot="$PWD/policy-layout/desktop.png" "file://$PWD/_site/feature-check/index.html"
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=390,2700 --screenshot="$PWD/policy-layout/mobile.png" "file://$PWD/_site/feature-check/index.html"
      - name: Retain coverage-policy previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: feature-policy-layouts
          path: policy-layout/*.png
          if-no-files-found: error

      - name: Check SBA report and interactive brief in desktop and mobile Chrome
        run: python scripts/capture_sba_layouts.py
      - name: Retain SBA layout previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sba-credit-layouts
          path: sba-layout/*.png
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
