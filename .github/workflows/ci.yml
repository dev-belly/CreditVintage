name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Exercise Windows checkout conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dev-belly/PITBridge
          ref: ed19dc698534f45a2b646fb4976ff6b01966b0cc
          path: .pitbridge
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e .pitbridge
      - name: Lint, formatting, types and tests
        shell: bash
        run: |
          set +e
          status=0
          ruff check src tests --output-format concise || status=1
          ruff format --check --diff src tests || status=1
          mypy src || status=1
          pytest -q || status=1
          exit "$status"
      - run: creditvintage run --out outputs/ci
      - run: creditvintage verify outputs/ci
      - run: creditvintage benchmark --out outputs/ci-benchmark
      - run: creditvintage verify-benchmark outputs/ci-benchmark
      - run: creditvintage monitor --as-of 2024-10-01 --out outputs/ci-monitor
      - run: creditvintage verify-monitor outputs/ci-monitor
      - run: creditvintage verify docs/demo
      - run: creditvintage analyze docs/demo --out outputs/ci-analysis
      - run: creditvintage verify-analysis outputs/ci-analysis
      - run: creditvintage review-init outputs/ci-analysis --db outputs/ci-reviews.sqlite
      - run: creditvintage review-status outputs/ci-reviews.sqlite
      - run: creditvintage review-export outputs/ci-reviews.sqlite --out outputs/ci-review-evidence
      - run: creditvintage verify-reviews outputs/ci-review-evidence
      - run: creditvintage verify-monitor docs/monitor
      - run: creditvintage lineage-demo --out outputs/ci-lineage
      - run: creditvintage verify-lineage outputs/ci-lineage
  distribution:
    name: Installed distributions (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dev-belly/PITBridge
          ref: ed19dc698534f45a2b646fb4976ff6b01966b0cc
          path: .pitbridge
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build ruff
      - name: Check the distribution replay script
        run: ruff check scripts/check_distribution.py
      - run: ruff format --check scripts/check_distribution.py
      - name: Build the sdist and its wheel, then the pinned optional integration
        run: |
          python -m build --outdir dist
          python -m build --wheel --outdir dist .pitbridge
      - name: Install clean wheels outside both source trees and replay user workflows
        env:
          PYTHONUTF8: "0"
        run: python scripts/check_distribution.py dist
