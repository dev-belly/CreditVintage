name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Exercise Windows checkout conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dev-belly/PITBridge
          ref: ed19dc698534f45a2b646fb4976ff6b01966b0cc
          path: .pitbridge
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -e .pitbridge
      - name: Lint, formatting, types and tests
        shell: bash
        run: |
          set +e
          status=0
          ruff check src tests --output-format concise || status=1
          ruff format --check --diff src tests || status=1
          ruff check examples/german_credit.py examples/monitoring_without_outcomes.py || status=1
          ruff format --check examples/german_credit.py examples/monitoring_without_outcomes.py || status=1
          mypy src || status=1
          pytest -q || status=1
          exit "$status"
      - run: creditvintage run --out outputs/ci
      - run: creditvintage preflight --config examples/cohort-config.json
      - run: creditvintage public-benchmark --out outputs/ci-public
      - run: creditvintage verify-public outputs/ci-public
      - name: Replay the five-split public credit comparison
        run: |
          python examples/german_credit.py --out outputs/public-credit-comparison
          python examples/german_credit.py --verify outputs/public-credit-comparison
          python examples/german_credit.py --verify docs/public-credit-comparison
      - run: creditvintage verify outputs/ci
      - run: creditvintage benchmark --out outputs/ci-benchmark
      - run: creditvintage verify-benchmark outputs/ci-benchmark
      - run: creditvintage monitor --as-of 2024-10-01 --out outputs/ci-monitor
      - run: creditvintage verify-monitor outputs/ci-monitor
      - name: Run the editable example without current outcome labels
        run: python examples/monitoring_without_outcomes.py --out outputs/ci-unlabelled-case
      - run: creditvintage verify docs/demo
      - run: creditvintage analyze docs/demo --out outputs/ci-analysis
      - run: creditvintage verify-analysis outputs/ci-analysis
      - run: creditvintage review-init outputs/ci-analysis --db outputs/ci-reviews.sqlite
      - run: creditvintage review-status outputs/ci-reviews.sqlite
      - run: creditvintage review-export outputs/ci-reviews.sqlite --out outputs/ci-review-evidence
      - run: creditvintage verify-reviews outputs/ci-review-evidence
      - run: creditvintage verify-monitor docs/monitor
      - run: creditvintage lineage-demo --out outputs/ci-lineage
      - run: creditvintage verify-lineage outputs/ci-lineage
  distribution:
    name: Installed distributions (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dev-belly/PITBridge
          ref: ed19dc698534f45a2b646fb4976ff6b01966b0cc
          path: .pitbridge
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build ruff
      - name: Check the distribution replay script
        run: ruff check scripts/check_distribution.py scripts/release_artifacts.py scripts/convert_card_source.py
      - run: ruff format --check scripts/check_distribution.py scripts/release_artifacts.py scripts/convert_card_source.py
      - name: Build the sdist and its wheel, then the pinned optional integration
        run: |
          python -m build --outdir dist
          python -m build --wheel --outdir dist .pitbridge
      - name: Install clean wheels outside both source trees and replay user workflows
        env:
          PYTHONUTF8: "0"
        shell: bash
        run: python scripts/check_distribution.py dist --card-evidence portable-card/evidence.zip > installed-check.json
      - name: Retain Linux Python 3.12 card evidence for other runtimes
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: card-replay-evidence
          path: portable-card/evidence.zip
          if-no-files-found: error
      - name: Prepare exact checked release assets
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: python scripts/release_artifacts.py prepare dist installed-check.json release --commit "$BUILD_SHA"
      - name: Retain the distributions that passed installation and refitting
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: checked-distributions
          path: release/*
          if-no-files-found: error
          retention-days: 30
  portable-card:
    name: Cross-runtime card replay (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: distribution
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: checked-distributions
          path: checked-release
      - uses: actions/download-artifact@v4
        with:
          name: card-replay-evidence
          path: portable-card
      - name: Install the checked Linux-built wheel without a source checkout
        shell: bash
        run: python -m pip install checked-release/*.whl
      - name: Refit the same Linux evidence on another OS or Python version
        shell: bash
        run: |
          python - <<'PY'
          import json
          import tempfile
          import zipfile
          from pathlib import Path
          from creditvintage.card_credit import CARD_FILES, verify_card_benchmark

          archive_bytes = Path("portable-card/evidence.zip").read_bytes()
          with tempfile.TemporaryDirectory() as temporary:
              directory = Path(temporary)
              with zipfile.ZipFile("portable-card/evidence.zip") as archive:
                  if archive.namelist() != [*CARD_FILES, "manifest.json"]:
                      raise ValueError("Unexpected card evidence file set")
                  archive.extractall(directory)
              (directory / "evidence.zip").write_bytes(archive_bytes)
              print(json.dumps(verify_card_benchmark(directory), indent=2))
          PY
