name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: pytest -q
      - run: creditvintage run --out outputs/ci
      - run: creditvintage verify outputs/ci
      - run: creditvintage monitor --as-of 2024-10-01 --out outputs/ci-monitor
      - run: creditvintage verify-monitor outputs/ci-monitor
      - run: creditvintage verify docs/demo
      - run: creditvintage verify-monitor docs/monitor
