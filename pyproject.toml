[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "creditvintage-research"
version = "0.3.2"
description = "Point-in-time credit vintage evaluation and auditable risk reporting"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "src/creditvintage/data/*/SOURCE.md"]
# Exact numerical versions keep installed-package replay aligned with published evidence.
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "scikit-learn==1.8.0"]

[project.urls]
Repository = "https://github.com/dev-belly/CreditVintage"
Reports = "https://dev-belly.github.io/CreditVintage/"
Issues = "https://github.com/dev-belly/CreditVintage/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.10"]
source = ["pandas>=2.2,<4", "xlrd>=2,<3"]

[project.scripts]
creditvintage = "creditvintage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
creditvintage = ["*.html", "*.sql", "data/german_credit/*", "data/card_credit/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
ignore_missing_imports = true
