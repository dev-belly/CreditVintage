<!doctype html>
<html lang="@@LANG@@">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@@TITLE@@</title>
  <meta name="description" content="@@DESCRIPTION@@">
  <link rel="canonical" href="@@CANONICAL_URL@@">
  <link rel="alternate" hreflang="zh-CN" href="https://dev-belly.github.io/CreditVintage/sba-brief/">
  <link rel="alternate" hreflang="en" href="https://dev-belly.github.io/CreditVintage/sba-brief/en/">
  <style>
    :root { color-scheme: light; --ink: #153c38; --muted: #546d66; --teal: #006c60; --line: #d0ded4; --paper: #f3f5ee; --orange: #95501b; font-family: system-ui, -apple-system, "Noto Sans CJK SC", "Noto Sans SC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-size: 16px; line-height: 1.75; }
    main { max-width: 1160px; margin: auto; padding: 26px 30px 48px; }
    a { color: var(--teal); text-underline-offset: 4px; }
    nav, .actions, .pills { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; }
    nav { justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 18px; font-size: 14px; }
    .brand { font-weight: 800; text-decoration: none; letter-spacing: -.02em; }
    .nav-links { display: flex; flex-wrap: wrap; gap: 18px; }
    header { padding: 38px 0 20px; }
    .eyebrow { color: var(--teal); font-size: 12px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    h1 { font-size: clamp(32px, 4.8vw, 55px); line-height: 1.2; letter-spacing: -.045em; margin: 16px 0 22px; }
    h2 { margin: 0 0 12px; font-size: clamp(22px, 3vw, 29px); line-height: 1.4; letter-spacing: -.025em; }
    h3 { font-size: 16px; margin: 0 0 12px; }
    p { margin: 10px 0; }
    .lead { max-width: 850px; color: var(--muted); font-size: 18px; }
    .pills { margin-top: 24px; gap: 10px; font-size: 13px; }
    .pills span { border: 1px solid var(--line); background: #fff; border-radius: 30px; padding: 5px 13px; }
    .lab { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 26px; }
    fieldset { border: 0; padding: 0; margin: 0 0 14px; }
    legend { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
    .budget-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
    button { font: inherit; cursor: pointer; }
    .budget-buttons button { border: 1px solid #a9c3b8; border-radius: 7px; background: #f5f8f2; padding: 10px 17px; font-size: 14px; color: var(--ink); }
    .budget-buttons button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    button:disabled { cursor: default; }
    .status { color: var(--muted); font-size: 14px; min-height: 25px; }
    .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
    .result-card { min-width: 0; border: 1px solid var(--line); border-top: 4px solid #8d9c94; border-radius: 9px; padding: 18px; background: #f9faf6; }
    .result-card.logistic { border-top-color: var(--teal); background: #edf5ed; }
    .result-card.isotonic { border-top-color: #be7940; background: #fcf4e9; }
    .found { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; margin: 0 0 10px; font-variant-numeric: tabular-nums; }
    .found strong { font-size: 43px; line-height: 1.3; letter-spacing: -.04em; }
    .found span, .outside { color: var(--muted); font-size: 12px; }
    meter { display: block; width: 100%; height: 13px; accent-color: var(--teal); }
    dl { margin: 15px 0 0; font-size: 12px; }
    dl div { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
    dd { margin: 0; font-size: 15px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .outside { margin: 12px 0 0; }
    .explanation { border-left: 3px solid var(--teal); padding: 4px 0 4px 15px; font-size: 14px; }
    .scope { color: var(--orange); font-size: 13px; }
    .share { color: var(--teal); background: transparent; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 4px; font-size: 13px; }
    .share-wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 15px; }
    #share-status { color: var(--muted); font-size: 12px; }
    .section { margin-top: 34px; }
    .reading-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    .reading-grid article { border-top: 1px solid var(--line); padding-top: 20px; min-width: 0; }
    .muted { color: var(--muted); font-size: 14px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    th, td { padding: 9px 11px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    th { background: #e9f0e7; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    details { margin: 24px 0; }
    summary { cursor: pointer; font-weight: 650; }
    details .table-wrap { margin-top: 15px; }
    ol, ul { padding-left: 22px; }
    li { margin: 8px 0; }
    pre { background: #153c38; color: #f4f7ee; border-radius: 8px; padding: 16px; overflow-x: auto; font-size: 12px; line-height: 1.8; }
    code { overflow-wrap: anywhere; }
    .button { display: inline-block; background: var(--ink); color: #fff; padding: 9px 15px; border: 1px solid var(--ink); border-radius: 7px; text-decoration: none; font-size: 14px; }
    .button.secondary { color: var(--ink); background: transparent; }
    footer { border-top: 1px solid var(--line); margin-top: 35px; padding-top: 20px; font-size: 13px; color: var(--muted); }
    .digest { font-size: 11px; word-break: break-all; }
    :focus-visible { outline: 3px solid #a35d28; outline-offset: 4px; }
    @media (max-width: 700px) { main { padding: 20px 17px 36px; } header { padding-top: 25px; } .lab { padding: 19px 15px; } .result-grid { grid-template-columns: 1fr; gap: 12px; } .result-card { padding: 15px; } .found strong { font-size: 37px; } .reading-grid { grid-template-columns: 1fr; gap: 20px; } .budget-buttons { gap: 8px; } .budget-buttons button { padding: 10px 12px; } .lead { font-size: 16px; } }
  </style>
</head>
<body>
@@BODY@@
<script type="application/json" id="study-data">@@BRIEF_DATA@@</script>
<script type="application/json" id="ui-copy">@@UI_COPY@@</script>
<script>
(() => {
  "use strict";
  const study = JSON.parse(document.getElementById("study-data").textContent);
  const copy = JSON.parse(document.getElementById("ui-copy").textContent);
  const message = (key, values = {}) => copy[key].replace(/\{([a-z_]+)\}/g, (_, name) => values[name]);
  const buttons = [...document.querySelectorAll("button[data-capacity]")];
  const whole = value => value.toLocaleString("en-US");
  const percent = (numerator, denominator) => `${(100 * numerator / denominator).toFixed(2)}%`;
  let current = 10;
  let copyAttempt = 0;
  function render(capacity, writeHash) {
    current = capacity;
    copyAttempt += 1;
    document.getElementById("share-status").textContent = "";
    buttons.forEach(button => button.setAttribute("aria-pressed", String(Number(button.dataset.capacity) === capacity)));
    for (const card of document.querySelectorAll(".result-card")) {
      const row = study.policies.find(item => item.method === card.dataset.method && item.capacity_percent === capacity);
      card.querySelector(".captured").textContent = row.captured;
      card.querySelector("meter").value = row.captured;
      card.querySelector(".precision").textContent = percent(row.captured, row.reviewed);
      card.querySelector(".capture").textContent = percent(row.captured, row.total_events);
      card.querySelector(".outside").textContent = message("outside", {outside: row.total_events - row.captured});
    }
    const raw = study.policies.find(item => item.method === "logistic" && item.capacity_percent === capacity);
    document.getElementById("selection-status").textContent = message("status", {reviewed: whole(raw.reviewed), test_records: whole(study.test_records)});
    document.getElementById("denominator-explanation").textContent = message("explanation", {captured: raw.captured, reviewed: whole(raw.reviewed), precision: percent(raw.captured, raw.reviewed), events: raw.total_events, capture: percent(raw.captured, raw.total_events)});
    const languageLink = document.querySelector("[data-language-link]");
    const alternate = new URL(languageLink.href);
    alternate.hash = `capacity=${capacity}`;
    languageLink.href = alternate.href;
    if (writeHash) history.replaceState(null, "", `#capacity=${capacity}`);
  }
  function fromHash() {
    const match = /^#capacity=(5|10|20)$/.exec(location.hash);
    render(match ? Number(match[1]) : 10, false);
  }
  buttons.forEach(button => button.addEventListener("click", () => render(Number(button.dataset.capacity), true)));
  window.addEventListener("hashchange", fromHash);
  const copyButton = document.getElementById("copy-scenario");
  copyButton.addEventListener("click", async () => {
    const attempt = ++copyAttempt;
    const scenario = new URL(location.href);
    scenario.hash = `capacity=${current}`;
    try {
      await navigator.clipboard.writeText(scenario.href);
      if (attempt === copyAttempt) document.getElementById("share-status").textContent = message("copied");
    } catch {
      if (attempt === copyAttempt) {
        history.replaceState(null, "", scenario.hash);
        document.getElementById("share-status").textContent = message("copy_fallback");
      }
    }
  });
  fromHash();
  document.getElementById("capacity-controls").disabled = false;
  copyButton.disabled = false;
})();
</script>
</body>
</html>
