<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case review</title>
<style>
:root {font: 16px/1.5 system-ui; color: #17312b; background: #f2f5f1}
* {box-sizing: border-box}
body {margin: 0}
header {background: #153b31; color: white; padding: 1rem max(1rem, calc((100vw - 960px)/2))}
main {max-width: 992px; margin: auto; padding: 1.5rem 1rem}
h1 {margin: 0 0 1rem; line-height: 1.15}
h2 {font-size: 1.1rem}
section {padding: 1rem; margin: 1rem 0; background: white; border: 1px solid #c8d7ce; border-radius: .75rem}
.controls {display: flex; flex-wrap: wrap; gap: .75rem; align-items: end}
label {display: grid; gap: .25rem; min-width: 0}
button,input,select,textarea {font: inherit; border: 1px solid #73877f; border-radius: .4rem; padding: .45rem .6rem; max-width: 100%}
button {background: #18583f; color: white; cursor: pointer}
button:disabled {opacity: .6; cursor: default}
:focus-visible {outline: 3px solid #ac6c08; outline-offset: 2px}
output {display: block; min-height: 1.5em; margin: 1rem 0}
output[data-error="true"] {color: #952d17}
li,code,dd {overflow-wrap: anywhere}
dl {display: grid; grid-template-columns: minmax(5rem, 1fr) 2fr; gap: .25rem .75rem}
dd {margin: 0; font-variant-numeric: tabular-nums}
[hidden] {display:none!important}
</style>
<header>CreditVintage · Local workspace</header>
<main>
<h1>Case review</h1>

<section>
<form id="review" class="controls">
  <label>Case <select id="case" required></select></label>
  <label>Reviewer <input id="actor" required maxlength="200" autocomplete="off"></label>
  <label>Action <select id="action"></select></label>
  <label id="reason-field" hidden>Reason <input id="note" maxlength="2000"></label>
  <label id="evidence-field" hidden>Evidence reference <input id="reference" maxlength="2000"></label>
  <label id="outcome-field" hidden>Conclusion
    <select id="outcome"><option value="cleared">Cleared</option>
    <option value="escalated">Escalated</option></select>
  </label>
  <button id="submit" disabled>Save review</button>
  <button id="reload" type="button">Refresh</button>
</form>
<p id="case-state"></p>
</section>
<output id="message" role="status"></output>
<section><h2>Case history</h2><p id="empty"></p><ol id="history"></ol></section>
</main>
<script>
const byId = id => document.getElementById(id);
function node(tag, value) {
  const item = document.createElement(tag);
  item.textContent = value;
  return item;
}
function status(message, error = false) {
  byId("message").textContent = message;
  byId("message").dataset.error = error;
}
async function api(path, body) {
  const response = await fetch("/api/" + path, body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
  });
  const value = await response.json();
  if (!response.ok) throw new Error(value.error);
  return value;
}

let workspace;
let busy = false;
let pending;
const actions = {queued: ["claim"], in_review: ["resolve", "release"], resolved: ["reopen"]};

function renderCase() {
  const selected = workspace?.cases.find(row => row.application_id === byId("case").value);
  const previous = byId("action").value;
  const available = actions[selected?.status] || [];
  byId("action").replaceChildren(...available.map(value => new Option(value, value)));
  if (available.includes(previous)) byId("action").value = previous;
  byId("case-state").textContent = selected
    ? [selected.status, "version " + selected.version, selected.owner, selected.outcome].filter(Boolean).join(" · ")
    : "No cases in the workspace.";
  const events = workspace?.history.filter(event => event.application_id === selected?.application_id) || [];
  byId("empty").textContent = events.length ? "" : "No recorded actions.";
  byId("history").replaceChildren(...events.map(event => node("li",
    [event.occurred_at, event.actor, event.action, event.outcome, event.note, event.evidence]
      .filter(Boolean).join(" · "))));
  renderAction();
}
function renderAction() {
  const action = byId("action").value;
  const reason = action !== "" && action !== "claim";
  const resolution = action === "resolve";
  byId("reason-field").hidden = !reason;
  byId("evidence-field").hidden = !resolution;
  byId("outcome-field").hidden = !resolution;
  byId("note").required = reason;
  byId("reference").required = resolution;
  byId("submit").disabled = busy || !action;
}
async function refresh() {
  const selected = byId("case").value;
  workspace = await api("state");
  byId("case").replaceChildren(...workspace.cases.map(row => new Option(
    row.review_rank + " · " + row.application_id, row.application_id
  )));
  if (workspace.cases.some(row => row.application_id === selected)) byId("case").value = selected;
  renderCase();
}
byId("case").addEventListener("change", renderCase);
byId("action").addEventListener("change", renderAction);
byId("reload").addEventListener("click", async () => {
  if (busy) return;
  busy = true;
  renderAction();
  try { await refresh(); status("Workspace refreshed."); }
  catch (error) { status(error.message, true); }
  finally { busy = false; renderAction(); }
});
byId("review").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;
  const selected = workspace?.cases.find(row => row.application_id === byId("case").value);
  const action = byId("action").value;
  if (!selected || !action) return;
  const command = {
    application_id: selected.application_id, action, actor: byId("actor").value.trim(),
    expected_version: selected.version, note: action === "claim" ? "" : byId("note").value.trim(),
    evidence: action === "resolve" ? byId("reference").value.trim() : "",
    outcome: action === "resolve" ? byId("outcome").value : ""
  };
  const key = JSON.stringify(command);
  if (pending?.key !== key) pending = {key, request_id: crypto.randomUUID()};
  busy = true;
  renderAction();
  try {
    await api("change", {...command, request_id: pending.request_id});
    pending = undefined;
    byId("note").value = "";
    byId("reference").value = "";
    await refresh();
    status("Review saved.");
  } catch (error) {
    status(error.message, true);
    if (error.message.includes("Stale review version")) {
      try { await refresh(); } catch { /* Keep the original conflict visible. */ }
    }
  } finally { busy = false; renderAction(); }
});
refresh().catch(error => status(error.message, true));

</script>
</html>
